name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install httpx==0.28.1
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
  native-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: ee5b5ec21e576ccf9b941f9ff71330418415a5cb
          path: hermes-host
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.2
      - run: uv sync --frozen --no-dev --project hermes-host --python 3.11
      - name: Install exact GitHub artifact and exercise native CLI
        env:
          PLUGIN_REVISION: '${{ github.event.pull_request.head.sha || github.sha }}'
        run: >-
          python scripts/verify_host.py
          --hermes-source "$PWD/hermes-host"
          --python "$PWD/hermes-host/.venv/bin/python"
          --revision "$PLUGIN_REVISION"
